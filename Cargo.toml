[package]
name = "rsinfer"
version = "0.1.0"
edition = "2021"
description = "SafetyRAISE 的 Rust 本地 Qwen 模型推理框架"
license = "Apache-2.0"
repository = "https://github.com/QianYan-Art/SafetyRAISE-LMEngine"

[features]
# 仅控制设备测试是否默认执行；不改变生产 GPU 支持。
gpu-tests = []

[dependencies]
ndarray = "0.16"
safetensors = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = { version = "2", features = ["num-traits", "serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rayon = "1"
wgpu = "29.0.3"
pollster = "0.4.0"
bytemuck = "1.25.0"
memmap2 = "0.9"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
axum = { version = "0.8", features = ["json"] }
tokio-stream = "0.1"
base64 = "0.22"
minijinja = { version = "2", features = ["builtins", "json", "loop_controls", "fuel"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "rsinfer"
path = "src/lib.rs"

[[bin]]
name = "rsinfer"
path = "src/main.rs"
