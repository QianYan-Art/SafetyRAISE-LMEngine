[package]
name = "rsinfer"
version = "0.1.0"
edition = "2021"
description = "A minimal LLM inference engine written in Rust"

[dependencies]
ndarray = "0.16"
safetensors = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = { version = "2", features = ["num-traits", "serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lib]
name = "rsinfer"
path = "src/lib.rs"

[[bin]]
name = "rsinfer"
path = "src/main.rs"
