name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plugin: target/native/bin/libsafetyraise_cpu.so
          - os: windows-latest
            plugin: target/native/bin/Release/safetyraise_cpu.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # 托管运行器不提供本项目验收过的 GPU；硬件测试在目标设备显式执行。
      - name: CPU and protocol tests
        run: cargo test --release -- --skip gpu::tests:: --skip _when_available
      - name: Native CPU plugin
        run: |
          cmake -S native -B target/native -DSAFETYRAISE_BUILD_CUDA=OFF
          cmake --build target/native --config Release
      - name: Native ABI roundtrip
        env:
          RSINFER_NATIVE_CPU_PLUGIN: ${{ github.workspace }}/${{ matrix.plugin }}
        run: cargo test --release --lib backend::tests::native_cpu_plugin_roundtrip_caches_weight_and_propagates_error -- --ignored --exact
